name: Manual Container Build
on:
  workflow_dispatch:
    inputs:
      container:
        description: 'Select container to build'
        required: true
        default: 'all'
        type: choice
        options: [all, api, webui]
      tag:
        description: 'Custom tag suffix (optional)'
        required: false
        default: 'manual'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.container }}" == "all" ]; then
            echo 'matrix=[{"service": "api", "file": "Dockerfile"}, {"service": "webui", "file": "web/Dockerfile"}]' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.container }}" == "api" ]; then
            echo 'matrix=[{"service": "api", "file": "Dockerfile"}]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=[{"service": "webui", "file": "web/Dockerfile"}]' >> $GITHUB_OUTPUT
          fi
  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/scrape-tool-${{ matrix.service }}:${{ github.event.inputs.tag }}
            ghcr.io/${{ github.repository }}/scrape-tool-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
